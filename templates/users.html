{% extends "base.html" %}
{% block content %}
<h2>Users</h2>
<table class="table table-bordered table-striped">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
    </tr>
    {% for member in users %}
    <tr>
        <td>{{ member.name }}</td>
        <td>{{ member.email }}</td>
        <td>{{ member.role }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
