{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h3 class="mb-3">Signup</h3>
    <form method="POST">
        <label>Name</label>
        <input class="form-control mb-3" type="text" name="name" required>
        <label>Email</label>
        <input class="form-control mb-3" type="email" name="email" required>
        <label>Password</label>
        <input class="form-control mb-3" type="password" name="password" required>
        <label>Role</label>
        <select class="form-control mb-3" name="role">
            <option>Member</option>
            <option>Admin</option>
        </select>
        <button class="btn btn-success w-100">Signup</button>
    </form>
    <p class="mt-3 text-center">Already have account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
